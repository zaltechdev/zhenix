name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile i18n
        run: bun run i18n:compile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test

      - name: Production Build
        run: bun run build
        env:
          GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY || 'mock-key' }}
          GOOGLE_AI_MODEL: ${{ secrets.GOOGLE_AI_MODEL || 'gemini-2.5-flash' }}
          BAI_BASE_URL: ${{ secrets.BAI_BASE_URL || 'https://api.example.com' }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'aksa-ci-production-build-secret-key-32chars' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET || 'aksa-ci-production-build-secret-key-32chars' }}
          BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL || 'http://localhost:3000' }}
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"
